spring:
  application:
    name: CarReservationApp

  jpa:
    hibernate:
      ddl-auto: create-drop

  datasource:
    url: jdbc:h2:mem:state_street
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  nlp:
    repository-type: STANFORD_NLP_AND_REGEX

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4.1-mini
          temperature: 0
          response-format:
            type: JSON_OBJECT

